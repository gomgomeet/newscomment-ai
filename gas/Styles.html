<style>
  :root {
    --ink: #172033;
    --muted: #62708a;
    --surface: #ffffff;
    --canvas: #eef3fb;
    --primary: #2756d8;
    --primary-dark: #173da8;
    --primary-soft: #e8efff;
    --student: #2756d8;
    --bot: #fff8df;
    --bot-line: #f0d87a;
    --evidence: #e8f7f1;
    --evidence-line: #49a886;
    --line: #d8e1ef;
    --focus: #e76922;
    --material-font-size: 1.08rem;
    --shadow: 0 18px 45px rgba(36, 53, 86, 0.11);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { min-height: 100%; }
  body {
    min-height: 100vh;
    margin: 0;
    color: var(--ink);
    background: radial-gradient(circle at 10% 0%, rgba(39, 86, 216, 0.12), transparent 28rem), var(--canvas);
    font-family: Arial, "Noto Sans KR", sans-serif;
    font-size: 16px;
    line-height: 1.65;
  }
  button, input, textarea { font: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible,
  summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  button { cursor: pointer; }
  button:disabled { cursor: wait; opacity: 0.55; }
  .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  .app-shell { display:flex; width:min(1240px,calc(100% - 32px)); height:100vh; height:100dvh; flex-direction:column; margin:0 auto; padding:18px 0 30px; }
  .app-header { display:flex; align-items:center; gap:13px; min-height:64px; flex:0 0 auto; margin-bottom:14px; }
  .brand-mark { display:grid; width:48px; height:48px; place-items:center; flex:0 0 auto; border-radius:15px 15px 15px 5px; color:white; background:var(--primary); box-shadow:0 8px 18px rgba(39,86,216,.25); font-size:1.35rem; font-weight:900; }
  .brand-copy { min-width:0; }
  .eyebrow,.section-kicker { margin:0; color:var(--primary-dark); font-size:.8rem; font-weight:800; letter-spacing:.06em; }
  h1 { margin:-2px 0 0; font-size:clamp(1.5rem,3vw,2rem); line-height:1.2; }
  h2 { margin:2px 0 0; font-size:clamp(1.1rem,2vw,1.35rem); line-height:1.4; }
  .header-meta { display:flex; align-items:center; gap:9px; margin-left:auto; }
  .subject-chip,.student-code { display:inline-flex; min-height:34px; align-items:center; padding:5px 11px; border:1px solid #c8d5ee; border-radius:999px; color:var(--primary-dark); background:rgba(255,255,255,.75); font-size:.875rem; font-weight:700; }
  .student-code { color:var(--muted); }
  .mobile-tabs { display:none; }

  .learning-workspace { display:grid; min-height:0; flex:1; grid-template-columns:minmax(0,42fr) minmax(0,58fr); align-items:stretch; gap:16px; }
  .workspace-panel { min-width:0; min-height:0; height:100%; overflow:hidden; border:1px solid var(--line); border-radius:22px; background:var(--surface); box-shadow:var(--shadow); }
  .panel-header { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex:0 0 auto; padding:20px 22px 17px; border-bottom:1px solid var(--line); }
  .material-panel { display:flex; flex-direction:column; }
  .material-header { background:linear-gradient(135deg,#fff,#f1f5ff); }
  .material-meta { margin:7px 0 0; color:var(--muted); font-size:.9rem; }
  .font-controls { display:flex; gap:5px; flex:0 0 auto; }
  .font-controls button { min-width:42px; min-height:40px; padding:5px; border:1px solid #bdcbe5; border-radius:10px; color:var(--primary-dark); background:white; font-weight:800; }
  .learning-goal { margin:16px 22px 0; padding:10px 12px; border-left:4px solid var(--primary); border-radius:8px; background:var(--primary-soft); font-size:.9rem; }
  .learning-goal summary { color:var(--primary-dark); font-weight:800; cursor:pointer; }
  .learning-goal p { margin:7px 0 0; }
  .material-text { min-height:0; flex:1; overflow-y:auto; margin:14px 8px 8px; padding:8px 18px 28px; white-space:pre-wrap; font-size:var(--material-font-size); line-height:1.95; word-break:keep-all; }
  .material-text mark { padding:2px 1px; border-radius:4px; color:inherit; background:#ffe68a; box-shadow:0 0 0 3px #ffe68a; }

  .chat-panel { display:flex; min-height:0; height:100%; flex-direction:column; }
  .chat-header { align-items:center; }
  .learning-progress { display:flex; gap:5px; margin:0; padding:0; list-style:none; }
  .learning-progress li { display:flex; align-items:center; gap:4px; color:#7a879d; font-size:.78rem; font-weight:700; }
  .learning-progress li + li::before { content:"›"; margin-right:1px; color:#aab5c7; }
  .learning-progress span { display:grid; width:25px; height:25px; place-items:center; border-radius:50%; background:#e8edf5; }
  .learning-progress b { font:inherit; }
  .learning-progress li.current,.learning-progress li.done { color:var(--primary-dark); }
  .learning-progress li.current span { color:white; background:var(--primary); }
  .learning-progress li.done span { color:#166b4f; background:#ccefe2; }
  .conversation-area { display:flex; min-height:0; flex:1; flex-direction:column; overflow:hidden; }
  .messages { display:flex; min-height:0; flex:1; flex-direction:column; gap:14px; overflow-y:auto; padding:20px 22px; scroll-behavior:smooth; }
  .message { width:fit-content; max-width:86%; }
  .message.student { align-self:flex-end; }
  .message.bot { align-self:flex-start; }
  .message-label { display:flex; align-items:center; gap:7px; margin:0 4px 5px; color:var(--muted); font-size:.78rem; font-weight:700; }
  .message.student .message-label { justify-content:flex-end; }
  .message-label-icon { display:grid; width:23px; height:23px; place-items:center; border-radius:8px; color:var(--primary-dark); background:var(--primary-soft); }
  .message-body { padding:13px 16px; border:1px solid var(--bot-line); border-radius:5px 17px 17px 17px; background:var(--bot); white-space:pre-wrap; word-break:keep-all; }
  .message.student .message-body { border-color:var(--student); border-radius:17px 5px 17px 17px; color:white; background:var(--student); }

  .evidence-panel { margin-top:9px; overflow:hidden; border:1px solid #a8d9c8; border-radius:13px; color:var(--ink); background:var(--evidence); font-size:.9rem; }
  .evidence-panel summary { padding:10px 12px; color:#12644a; font-weight:800; cursor:pointer; }
  .evidence-list { display:grid; gap:8px; margin:0; padding:0 10px 10px; list-style:none; }
  .evidence-item { padding:10px; border-left:4px solid var(--evidence-line); border-radius:8px; background:white; }
  .evidence-item p { margin:5px 0; }
  .evidence-location { color:var(--muted); font-size:.8rem; }
  .evidence-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:7px; }
  .evidence-actions button,.evidence-actions a { min-height:34px; padding:5px 9px; border:1px solid #8ac6b1; border-radius:8px; color:#12644a; background:white; font-size:.8rem; font-weight:800; text-decoration:none; }

  .onboarding { display:grid; gap:10px; margin:0 22px 18px; padding:16px; border:1px solid #bbcaec; border-radius:15px; background:#f1f5ff; }
  .onboarding[hidden] { display:none; }
  .onboarding p { margin:0; font-weight:800; }
  .onboarding label { font-size:.9rem; font-weight:800; }
  .onboarding small,.input-help { color:var(--muted); font-size:.78rem; }
  input,textarea { width:100%; padding:12px 13px; border:1px solid #9cabc3; border-radius:12px; color:var(--ink); background:white; font-size:1rem; }
  textarea { resize:none; }

  .interaction-dock { flex:0 0 auto; padding:12px 16px 14px; border-top:1px solid var(--line); background:#fbfcff; }
  .quick-actions { display:flex; gap:7px; overflow-x:auto; padding:2px 0 8px; }
  .quick-action { display:inline-flex; min-height:38px; align-items:center; gap:5px; flex:0 0 auto; padding:6px 10px; border:1px solid #bdcbe5; border-radius:999px; color:var(--primary-dark); background:white; font-size:.86rem; font-weight:800; }
  .quick-action:hover { background:var(--primary-soft); }
  .quick-action span { font-weight:900; }
  .status { min-height:25px; padding:0 4px 5px; color:var(--muted); font-size:.84rem; }
  .status.busy::before { display:inline-block; width:8px; height:8px; margin-right:7px; border-radius:50%; background:var(--primary); content:""; animation:pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity:.25; transform:scale(.75); } }
  .composer { display:grid; gap:4px; }
  .input-wrap { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:end; }
  .input-wrap textarea { min-height:64px; max-height:150px; }
  .send-button { min-width:76px; min-height:52px; padding:8px 13px; border:1px solid var(--primary); border-radius:13px; color:white; background:var(--primary); font-weight:800; }
  .send-button:hover { background:var(--primary-dark); }
  .composer-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .button-row { display:flex; flex-wrap:wrap; gap:9px; }
  .primary-button,.secondary-button,.text-button { min-height:42px; padding:7px 13px; border-radius:10px; font-weight:800; }
  .primary-button { border:1px solid var(--primary); color:white; background:var(--primary); }
  .secondary-button { border:1px solid var(--primary); color:var(--primary-dark); background:white; }
  .text-button { border:1px solid transparent; color:var(--muted); background:transparent; }

  @media (max-width:820px) {
    body { overflow:hidden; }
    .app-shell { width:100%; height:100vh; height:100dvh; padding:0; }
    .app-header { min-height:64px; margin:0; padding:9px 13px; background:white; border-bottom:1px solid var(--line); }
    .brand-mark { width:42px; height:42px; border-radius:13px 13px 13px 4px; }
    .eyebrow { display:none; }
    .header-meta { gap:5px; }
    .subject-chip { display:none; }
    .student-code { min-height:30px; padding:3px 8px; font-size:.75rem; }
    .mobile-tabs { display:grid; grid-template-columns:1fr 1fr; min-height:46px; flex:0 0 auto; padding:5px 8px; border-bottom:1px solid var(--line); background:white; }
    .mobile-tab { border:0; border-radius:9px; color:var(--muted); background:transparent; font-weight:800; }
    .mobile-tab.active { color:var(--primary-dark); background:var(--primary-soft); }
    .learning-workspace { display:block; min-height:0; height:calc(100vh - 110px); height:calc(100dvh - 110px); flex:0 0 auto; }
    .workspace-panel { display:none; height:100%; border:0; border-radius:0; box-shadow:none; }
    .workspace-panel.active { display:flex; }
    .panel-header { padding:14px 16px 12px; }
    .material-text { margin-top:10px; padding:5px 14px 25px; }
    .learning-goal { margin:12px 16px 0; }
    .learning-progress li { font-size:0; }
    .learning-progress li + li::before { font-size:.8rem; }
    .learning-progress span { font-size:.75rem; }
    .messages { padding:16px 14px; }
    .message { max-width:94%; }
    .onboarding { margin:0 14px 15px; }
    .interaction-dock { padding:9px 10px 10px; }
    .composer-footer .input-help { display:none; }
  }
  @media (max-width:430px) {
    h1 { font-size:1.2rem; }
    .chat-header h2 { font-size:1.02rem; }
    .panel-header { gap:8px; }
    .message-body { padding:11px 13px; }
    .send-button { min-width:66px; }
    .button-row button { flex:1 1 130px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { scroll-behavior:auto !important; animation:none !important; }
  }
</style>
