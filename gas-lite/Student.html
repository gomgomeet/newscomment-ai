<!DOCTYPE html>
<html lang="ko">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      :root { --ink:#172033; --muted:#64748b; --line:#dbe3ee; --blue:#2563eb; --soft:#eff6ff; }
      * { box-sizing:border-box; }
      body { margin:0; color:var(--ink); background:#f6f8fc; font:16px/1.6 Arial,"Noto Sans KR",sans-serif; }
      main { max-width:760px; margin:0 auto; padding:24px 18px; }
      .card { margin:14px 0; padding:20px; border:1px solid var(--line); border-radius:16px; background:white; }
      h1,h2 { margin:0 0 8px; }
      .meta,.status { color:var(--muted); }
      .mode { display:inline-block; padding:4px 10px; border-radius:999px; color:#1d4ed8; background:var(--soft); font-weight:700; }
      label { display:grid; gap:6px; font-weight:700; }
      input,textarea,button { width:100%; padding:11px 12px; border:1px solid #94a3b8; border-radius:10px; font:inherit; }
      textarea { min-height:100px; resize:vertical; }
      button { color:white; border-color:var(--blue); background:var(--blue); font-weight:800; }
      button:disabled { color:#64748b; border-color:#cbd5e1; background:#e2e8f0; }
      .notice { padding:11px 13px; border-radius:10px; background:var(--soft); }
      .material { max-height:320px; overflow:auto; white-space:pre-wrap; }
      .messages { display:grid; gap:10px; margin:14px 0; }
      .message { max-width:86%; padding:10px 12px; border-radius:12px; white-space:pre-wrap; }
      .message.student { margin-left:auto; color:white; background:var(--blue); }
      .message.bot { margin-right:auto; background:#eef2f7; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="app-name">질문챗봇</h1>
        <p id="lesson-meta" class="meta">수업 정보를 불러오는 중입니다.</p>
      </header>
      <section class="card">
        <span id="mode" class="mode">운영 모드</span>
        <h2 id="lesson-title">수업 준비 중</h2>
        <p id="lesson-goal"></p>
        <details>
          <summary id="material-title">수업자료 보기</summary>
          <p id="material-text" class="material"></p>
        </details>
      </section>
      <section class="card">
        <p id="start-question" class="notice"></p>
        <div id="messages" class="messages" aria-live="polite"></div>
        <label>반-번호
          <input id="student-code" inputmode="numeric" placeholder="예: 3-12">
        </label>
        <label>궁금한 점
          <textarea id="message" placeholder="자료를 읽고 궁금한 점을 적어 보세요."></textarea>
        </label>
        <button id="send" type="button" disabled>질문 보내기</button>
        <p id="status" class="status" role="status">중앙 엔진 연결 상태를 확인하고 있습니다.</p>
      </section>
    </main>
    <script>
      const byId = function (id) { return document.getElementById(id); };
      const deviceToken = getOrCreateDeviceToken();
      let chatReady = false;
      let sessionStarted = false;
      window.addEventListener('load', function () {
        byId('send').addEventListener('click', sendQuestion);
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(function (error) {
            byId('status').textContent = error && error.message ? error.message : String(error);
          })
          .getLiteStudentBootstrap();
      });
      function render(data) {
        const lesson = data.lesson || {};
        byId('app-name').textContent = lesson.appName || '질문챗봇';
        byId('lesson-meta').textContent = [lesson.grade, lesson.subject].filter(Boolean).join(' · ');
        byId('lesson-title').textContent = lesson.lessonTitle || '아직 수업이 설정되지 않았습니다.';
        byId('lesson-goal').textContent = lesson.lessonGoal || '';
        byId('material-title').textContent = lesson.materialTitle || '수업자료 보기';
        byId('material-text').textContent = lesson.materialText || '교사가 수업자료를 준비하고 있습니다.';
        byId('start-question').textContent = lesson.startQuestion || '교사가 시작 질문을 준비하고 있습니다.';
        byId('mode').textContent = lesson.activityMode === 'exploration' ? '탐색모드' : '평가모드';
        chatReady = Boolean(data.chatReady);
        byId('send').disabled = !chatReady;
        byId('status').textContent = chatReady
          ? '반-번호와 궁금한 점을 입력해 주세요. 이름과 연락처는 적지 않습니다.'
          : data.engineReady
            ? '교사가 개인 API와 수업 설정을 확인하고 있습니다.'
            : '교사 설정 미리보기입니다. 중앙 엔진 연결 뒤 질문 전송이 활성화됩니다.';
      }

      function getOrCreateDeviceToken() {
        const key = 'lite-question-bot-device';
        let token = '';
        try { token = localStorage.getItem(key) || ''; } catch (error) {}
        if (!/^[A-Za-z0-9_-]{16,100}$/.test(token)) {
          token = typeof crypto !== 'undefined' && crypto.randomUUID
            ? crypto.randomUUID().replace(/-/g, '')
            : 'device_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 18);
          try { localStorage.setItem(key, token); } catch (error) {}
        }
        return token;
      }

      function newRequestId() {
        return typeof crypto !== 'undefined' && crypto.randomUUID
          ? 'req_' + crypto.randomUUID().replace(/-/g, '')
          : 'req_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 18);
      }

      function startSession(done) {
        if (sessionStarted) { done(); return; }
        const code = byId('student-code').value.trim();
        google.script.run
          .withSuccessHandler(function (result) {
            sessionStarted = true;
            (result.history || []).forEach(function (item) {
              appendMessage(item.speaker === 'student' ? 'student' : 'bot', item.text);
            });
            done();
          })
          .withFailureHandler(showError)
          .startLiteStudentSession({ studentCode:code, deviceToken:deviceToken });
      }

      function sendQuestion() {
        if (!chatReady) return;
        const code = byId('student-code').value.trim();
        const message = byId('message').value.trim();
        if (!code || !message) {
          byId('status').textContent = '반-번호와 궁금한 점을 모두 입력해 주세요.';
          return;
        }
        byId('send').disabled = true;
        byId('status').textContent = '질문을 살펴보고 있어요.';
        startSession(function () {
          const requestId = newRequestId();
          appendMessage('student', message);
          byId('message').value = '';
          google.script.run
            .withSuccessHandler(function (result) {
              appendMessage('bot', result.reply || '답변을 불러오지 못했어요.');
              byId('status').textContent = result.isClosing
                ? '대화를 마쳤습니다.'
                : result.preview ? '미리보기 기록입니다. 실제 통계에는 포함하지 않습니다.' : '계속 궁금한 점을 이야기해 보세요.';
              byId('send').disabled = false;
            })
            .withFailureHandler(showError)
            .submitLiteTurn({
              requestId:requestId, studentCode:code, deviceToken:deviceToken, message:message
            });
        });
      }

      function appendMessage(role, text) {
        const item = document.createElement('div');
        item.className = 'message ' + role;
        item.textContent = text || '';
        byId('messages').appendChild(item);
        item.scrollIntoView({ behavior:'smooth', block:'nearest' });
      }

      function showError(error) {
        byId('status').textContent = error && error.message ? error.message : String(error);
        byId('send').disabled = !chatReady;
      }
    </script>
  </body>
</html>
