<script>
  const state = {
    bootstrapData:null, ready:false, busy:false, closed:false,
    studentCode:'', sessionId:'', joinCode:'', materialFontStep:1,
    deviceToken:getOrCreateDeviceToken(), pendingRequest:null,
    previewAccessToken:document.body.dataset.previewToken || '', retryTimer:null,
    bootstrapRecoveryChecked:false, bootstrapRecoveryPending:null, recoveryNotice:'',
    requiredSubmission:null, requiredSubmitting:false, requiredAssessmentReady:false,
    learningStage:'', canStartAssessment:false, composerEnabled:false,
    questionCounts:{ fact:0, inquiry:0, application:0, reflection:0, unclassified:0 },
    latestQuestionCategory:'', latestQuestionClassificationStatus:'', questionCountsVerified:false
  };
  const ACTIVE_PENDING_STORAGE_KEY = 'lite-pending-request:active';
  const ACTIVE_PENDING_MAX_AGE_MS = 25 * 60 * 60 * 1000;
  const elements = {};

  window.addEventListener('load', function () {
    [
      'app-name','activity-mode-label','activity-mode-description','chat-kicker','subject-chip',
      'student-code-label','student-code-prompt','material-panel','chat-panel','material-title','material-meta',
      'lesson-goal','start-question','material-text','font-smaller','font-larger','messages',
      'onboarding','student-code-input','join-code-input','start-button','status','chat-form','message-input',
      'definition-button','research-button','evidence-button','revise-button','why-button','content-button',
      'close-button','quick-actions','exit-session-button','retry-bootstrap-button','retry-turn-button',
      'required-assessment-notice','required-assessment-status','retry-required-assessment',
      'understanding-notice','understanding-guidance','assessment-start-dock','start-assessment-button',
      'question-type-banner','question-type-current','fact-question-count','inquiry-question-count',
      'application-question-count','reflection-question-count','unclassified-question-count'
    ].forEach(function (id) { elements[toCamel(id)] = document.getElementById(id); });
    elements.mobileTabs = Array.from(document.querySelectorAll('.mobile-tab'));
    elements.questionTypeChips = Array.from(document.querySelectorAll('[data-question-category]'));

    elements.chatForm.addEventListener('submit', function (event) {
      event.preventDefault(); sendTurn('message', elements.messageInput.value.trim());
    });
    elements.messageInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault(); sendTurn('message', elements.messageInput.value.trim());
      }
    });
    elements.studentCodeInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault(); beginConversation(elements.studentCodeInput.value);
      }
    });
    elements.joinCodeInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault(); beginConversation(elements.studentCodeInput.value);
      }
    });
    elements.startButton.addEventListener('click', function () { beginConversation(elements.studentCodeInput.value); });
    elements.retryBootstrapButton.addEventListener('click', loadBootstrap);
    elements.retryTurnButton.addEventListener('click', retryPendingTurn);
    elements.retryRequiredAssessment.addEventListener('click', finalizeRequiredAssessment);
    elements.startAssessmentButton.addEventListener('click', startAssessment);
    elements.definitionButton.addEventListener('click', function () { preparePrompt('___이(가) 뭐예요?'); });
    elements.whyButton.addEventListener('click', function () { preparePrompt('글에서 왜 ___인가요?'); });
    elements.contentButton.addEventListener('click', function () { preparePrompt('글의 ___ 부분을 쉽게 설명해 주세요.'); });
    elements.researchButton.addEventListener('click', function () { preparePrompt('___에 대해 더 알아보고 싶어요.'); });
    elements.evidenceButton.addEventListener('click', function () { preparePrompt('내 생각에는 ___'); });
    elements.reviseButton.addEventListener('click', function () { preparePrompt('다시 생각해 보니 ___'); });
    elements.closeButton.addEventListener('click', function () {
      if (state.busy || !window.confirm('대화를 마치고 최종 제출할까요? 제출 뒤에는 이 대화를 이어 쓸 수 없습니다.')) return;
      sendTurn('close', '이제 대화를 마칠게요.');
    });
    elements.exitSessionButton.addEventListener('click', leaveDeviceSession);
    elements.fontSmaller.addEventListener('click', function () { adjustMaterialFont(-1); });
    elements.fontLarger.addEventListener('click', function () { adjustMaterialFont(1); });
    elements.mobileTabs.forEach(function (tab) {
      tab.addEventListener('click', function () { switchPanel(tab.dataset.panel); });
      tab.addEventListener('keydown', handleTabKeydown);
    });

    loadBootstrap();
  });

  function loadBootstrap() {
    if (!state.bootstrapRecoveryChecked) {
      state.bootstrapRecoveryChecked = true;
      const activePending = readActivePendingRequest();
      if (activePending) {
        recoverPendingBeforeBootstrap(activePending, 0);
        return;
      }
    }
    state.bootstrapData = null;
    elements.retryBootstrapButton.hidden = true;
    elements.startButton.disabled = true;
    setComposerEnabled(false);
    setBusy(true, '활동을 준비하고 있어요.');
    google.script.run
      .withSuccessHandler(startApp)
      .withFailureHandler(showError)
      .getLiteStudentBootstrap(state.previewAccessToken);
  }

  function toCamel(value) {
    return value.replace(/-([a-z])/g, function (_, letter) { return letter.toUpperCase(); });
  }

  function startApp(data) {
    const lesson = data.lesson || {};
    state.bootstrapData = data;
    state.questionCounts = { fact:0, inquiry:0, application:0, reflection:0, unclassified:0 };
    state.questionCountsVerified = false;
    state.latestQuestionCategory = '';
    state.latestQuestionClassificationStatus = '';
    const joinLabel = document.querySelector('label[for="join-code-input"]');
    if (joinLabel) joinLabel.hidden = Boolean(data.previewAccess);
    elements.joinCodeInput.hidden = Boolean(data.previewAccess);
    elements.studentCodeInput.readOnly = Boolean(data.previewAccess);
    if (data.previewAccess) elements.studentCodeInput.value = '99-999';
    elements.studentCodePrompt.textContent = data.previewAccess
      ? '교사 전용 미리보기로 들어갑니다. 아래 번호는 자동으로 정해집니다.'
      : '반-번호를 입력해 주세요. 이름은 입력하지 않아요.';
    elements.retryBootstrapButton.hidden = true;
    renderLesson(lesson, false);
    elements.onboarding.hidden = false;
    addMessage('bot', '안녕! 먼저 반-번호로 들어온 뒤, 수업자료를 읽고 떠오른 생각이나 질문을 들려줘.', lesson.appName || 'simbot');
    const memoryKey = studentCodeStorageKey(lesson);
    if (!data.previewAccess) {
      try { elements.studentCodeInput.value = sessionStorage.getItem(memoryKey) || ''; } catch (error) {}
    }
    const defaultStatus = data.chatReady
      ? data.previewAccess
        ? '교사 전용 미리보기입니다. 99-999로 실제 질문을 한 번 보내 주세요.'
        : data.distributionReady
          ? '예: 3반 12번 → 3-12'
          : '선생님이 학생 배포 전 미리보기를 진행하고 있습니다.'
      : data.engineReady
        ? '선생님이 개인 API와 수업 설정을 확인하고 있습니다.'
        : '선생님이 기존 질문중심 챗봇 연결을 확인하고 있습니다.';
    setBusy(false, state.recoveryNotice || defaultStatus);
    state.recoveryNotice = '';
    elements.startButton.disabled = !data.chatReady || Boolean(state.bootstrapRecoveryPending);
    if (state.bootstrapRecoveryPending) {
      elements.retryTurnButton.dataset.action = 'recover-bootstrap';
      elements.retryTurnButton.textContent = '이전 전송 결과 확인';
      elements.retryTurnButton.hidden = false;
    }
    elements.studentCodeInput.focus();
  }

  function recoverPendingBeforeBootstrap(pending, attempts) {
    state.bootstrapRecoveryPending = pending;
    elements.retryTurnButton.hidden = true;
    setComposerEnabled(false);
    setBusy(true, '새로고침 전에 보내던 질문의 기록을 먼저 확인하고 있어요.');
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.retrySameRequest) {
          if (attempts < 5) {
            state.retryTimer = window.setTimeout(function () {
              recoverPendingBeforeBootstrap(pending, attempts + 1);
            }, Math.min(8000, 1400 + attempts * 1000));
            return;
          }
          pauseBootstrapRecovery(pending, result.warning || '이전 전송 결과를 아직 확인하고 있어요.');
          return;
        }
        clearStoredPendingRequest(pending);
        state.bootstrapRecoveryPending = null;
        state.recoveryNotice = result && result.ok
          ? '새로고침 전에 보낸 질문을 안전하게 기록했습니다.'
          : (result && result.reply) || '이전 전송 기록 확인을 마쳤습니다.';
        loadBootstrap();
      })
      .withFailureHandler(function (error) {
        const message = error && error.message ? error.message : '이전 전송 기록의 연결을 확인하지 못했어요.';
        if (isPermanentTurnError(message)) {
          clearStoredPendingRequest(pending);
          state.bootstrapRecoveryPending = null;
          state.recoveryNotice = message;
          loadBootstrap();
        } else if (attempts < 3) {
          state.retryTimer = window.setTimeout(function () {
            recoverPendingBeforeBootstrap(pending, attempts + 1);
          }, 1600 + attempts * 1200);
        } else {
          pauseBootstrapRecovery(pending, message);
        }
      })
      .submitLiteTurn(pendingPayload(pending));
  }

  function pauseBootstrapRecovery(pending, message) {
    state.bootstrapRecoveryPending = pending;
    state.recoveryNotice = (message || '이전 전송 결과를 확인하지 못했어요.') +
      ' 아래 버튼으로 같은 전송 번호를 다시 확인할 수 있어요.';
    loadBootstrap();
  }

  function renderLesson(lesson, unlocked) {
    elements.appName.textContent = lesson.appName || 'simbot';
    elements.activityModeLabel.textContent = lesson.activityMode === 'questioning' ? '질문하기 수업'
      : lesson.activityMode === 'exploration' ? '자료 탐색 모드' : '평가 모드';
    elements.activityModeDescription.textContent = lesson.activityMode === 'questioning'
      ? '자료를 읽고 궁금한 점을 직접 질문해 주세요. 질문하면 유형별 횟수가 위에 표시돼요.'
      : lesson.activityMode === 'exploration'
        ? '글을 읽고 궁금한 것을 질문해 주세요! 제목을 보고 어떤 내용인지 생각해 볼까요?'
      : lesson.understandingEnabled
        ? '글을 읽고 궁금한 것을 질문해 주세요! 제목을 보고 어떤 내용인지 생각해 볼까요?'
        : '평가 모드예요. 선생님이 확인한 자료를 중심으로 질문하고 생각을 나눠요.';
    elements.chatKicker.textContent = (lesson.appName || 'simbot') + ' · 질문 대화';
    elements.subjectChip.textContent = unlocked
      ? [lesson.subject, lesson.activityMode === 'questioning' ? '질문하기'
        : lesson.activityMode === 'exploration' ? '탐색' : '평가'].filter(Boolean).join(' · ')
      : '수업 입장 전';
    elements.materialTitle.textContent = unlocked ? (lesson.materialTitle || '수업자료') : '반-번호로 들어오면 수업자료가 열립니다.';
    elements.materialMeta.textContent = unlocked ? [lesson.grade, lesson.subject, lesson.lessonTitle].filter(Boolean).join(' · ') : '';
    elements.lessonGoal.textContent = unlocked ? (lesson.lessonGoal || '') : '수업에 들어온 뒤 오늘의 배움 목표를 확인할 수 있어요.';
    elements.startQuestion.textContent = unlocked ? (lesson.startQuestion || '자료를 읽고 가장 궁금한 점을 찾아보세요.') : '수업에 들어온 뒤 첫 생각 질문이 열립니다.';
    elements.materialText.textContent = unlocked ? (lesson.materialText || '') : '아직 수업자료를 공개하지 않았습니다.';
    elements.messageInput.placeholder = lesson.activityMode === 'questioning'
      ? '수업자료를 읽고 궁금한 점을 질문해 보세요.'
      : '지문을 읽고 떠오른 생각이나 질문을 적어 보세요.';
    renderQuestionTypeBanner();
    renderLearningStage();
  }

  const QUESTION_CATEGORIES = ['fact','inquiry','application','reflection'];
  const QUESTION_COUNT_KEYS = QUESTION_CATEGORIES.concat(['unclassified']);
  const QUESTION_CATEGORY_LABELS = { fact:'사실', inquiry:'탐구', application:'적용', reflection:'성찰' };

  function validQuestionCategory(value) {
    return QUESTION_CATEGORIES.indexOf(value) >= 0 ? value : '';
  }

  function updateQuestionTypeBanner(result, history) {
    const lesson = state.bootstrapData && state.bootstrapData.lesson || {};
    if (lesson.activityMode !== 'questioning') return;
    const received = result && result.questionCounts;
    if (received && typeof received === 'object') {
      state.questionCountsVerified = QUESTION_COUNT_KEYS.every(function (category) {
        const count = Number(received[category]);
        return Number.isSafeInteger(count) && count >= 0;
      });
      QUESTION_COUNT_KEYS.forEach(function (category) {
        const count = Number(received[category]);
        if (Number.isSafeInteger(count) && count >= 0) state.questionCounts[category] = count;
      });
    } else if (Array.isArray(history)) {
      state.questionCountsVerified = false;
      const counts = { fact:0, inquiry:0, application:0, reflection:0, unclassified:0 };
      history.forEach(function (turn) {
        // The server writes the student's question classification on its paired bot reply row.
        if (!turn || turn.speaker !== 'bot') return;
        if (turn.questionClassificationStatus === 'unclassified') {
          counts.unclassified += 1;
          return;
        }
        const category = validQuestionCategory(turn.questionCategory);
        if (category) counts[category] += 1;
      });
      state.questionCounts = counts;
    }
    let latest = validQuestionCategory(result && result.questionCategory);
    let latestStatus = result && result.questionClassificationStatus === 'unclassified'
      ? 'unclassified' : latest ? 'classified' : '';
    if (result && (result.ok === false || result.retryable || result.retrySameRequest)) {
      latest = '';
      latestStatus = '';
    }
    if (!latestStatus && Array.isArray(history)) {
      for (let index = history.length - 1; index >= 0; index -= 1) {
        const turn = history[index];
        if (!turn || turn.speaker !== 'bot') continue;
        if (turn.questionClassificationStatus === 'unclassified') {
          latest = '';
          latestStatus = 'unclassified';
          break;
        }
        latest = validQuestionCategory(turn.questionCategory);
        if (latest) {
          latestStatus = 'classified';
          break;
        }
      }
    }
    if (latestStatus) {
      state.latestQuestionClassificationStatus = latestStatus;
      state.latestQuestionCategory = latest;
    }
    renderQuestionTypeBanner();
  }

  function renderClosingQuestionSummary() {
    if (!elements.messages || !elements.messages.querySelector) return;
    const previous = elements.messages.querySelector('[data-closing-question-summary]');
    if (previous) previous.remove();
    const lesson = state.bootstrapData && state.bootstrapData.lesson || {};
    if (!state.closed || lesson.activityMode !== 'questioning') return;

    const card = document.createElement('section');
    card.className = 'closing-question-summary';
    card.dataset.closingQuestionSummary = 'true';
    card.setAttribute('aria-labelledby', 'closing-question-summary-title');
    const title = document.createElement('h3');
    title.id = 'closing-question-summary-title';
    title.textContent = '내 질문 돌아보기';
    card.appendChild(title);
    const explanation = document.createElement('p');
    if (state.bootstrapData.previewAccess) {
      explanation.textContent = '교사 미리보기 대화는 학생 질문 횟수에 포함되지 않아요.';
    } else if (!state.questionCountsVerified) {
      explanation.textContent = '질문 횟수를 확인하지 못했어요. 선생님에게 기록을 확인해 달라고 해 주세요.';
    } else {
      const counts = state.questionCounts;
      const total = QUESTION_COUNT_KEYS.reduce(function (sum, category) {
        return sum + counts[category];
      }, 0);
      explanation.textContent = total
        ? '이번 대화에서 질문을 ' + total + '번 했어요.'
        : '이번 대화에서 집계된 질문은 없어요.';
      card.appendChild(explanation);
      if (total) {
        const breakdown = document.createElement('p');
        breakdown.className = 'closing-question-breakdown';
        breakdown.textContent = '사실 ' + counts.fact + ' · 탐구 ' + counts.inquiry +
          ' · 적용 ' + counts.application + ' · 성찰 ' + counts.reflection +
          ' · 분류 보류 ' + counts.unclassified;
        card.appendChild(breakdown);
      }
      const note = document.createElement('small');
      note.textContent = '실제로 한 질문만 세었어요. 질문 유형은 자동 분류 초안이며 선생님이 확인합니다.';
      card.appendChild(note);
      elements.messages.appendChild(card);
      elements.messages.scrollTop = elements.messages.scrollHeight;
      return;
    }
    card.appendChild(explanation);
    elements.messages.appendChild(card);
    elements.messages.scrollTop = elements.messages.scrollHeight;
  }

  function renderQuestionTypeBanner() {
    if (!elements.questionTypeBanner) return;
    const lesson = state.bootstrapData && state.bootstrapData.lesson || {};
    elements.questionTypeBanner.hidden = lesson.activityMode !== 'questioning';
    if (elements.questionTypeBanner.hidden) return;
    const pending = state.latestQuestionClassificationStatus === 'unclassified';
    const latest = pending ? '' : validQuestionCategory(state.latestQuestionCategory);
    if (elements.questionTypeCurrent) elements.questionTypeCurrent.textContent = pending
      ? '최근 질문의 예상 유형: 분류 보류 · 선생님 확인'
      : latest ? '최근 질문의 예상 유형: ' + QUESTION_CATEGORY_LABELS[latest] + ' 질문'
        : '질문을 보내면 예상 유형이 표시돼요.';
    const countNodes = {
      fact:elements.factQuestionCount, inquiry:elements.inquiryQuestionCount,
      application:elements.applicationQuestionCount, reflection:elements.reflectionQuestionCount,
      unclassified:elements.unclassifiedQuestionCount
    };
    QUESTION_COUNT_KEYS.forEach(function (category) {
      if (countNodes[category]) countNodes[category].textContent = String(state.questionCounts[category] || 0);
    });
    (elements.questionTypeChips || []).forEach(function (chip) {
      chip.classList.toggle('is-current', chip.dataset.questionCategory === latest);
      chip.classList.toggle('is-pending', pending && chip.dataset.questionCategory === 'unclassified');
    });
  }

  function beginConversation(rawCode) {
    if (state.ready || state.busy || !state.bootstrapData || !state.bootstrapData.chatReady) return;
    const code = String(rawCode || '').trim();
    const joinCode = String(elements.joinCodeInput.value || '').trim();
    if (!/^\d{1,2}\s*-\s*\d{1,3}$/.test(code)) {
      showError({ message:'반-번호를 입력해 주세요. 예: 3-12' }); return;
    }
    if (!state.bootstrapData.previewAccess && !/^\d{6}$/.test(joinCode)) {
      showError({ message:'선생님이 알려 준 숫자 6자리 수업 참여코드를 입력해 주세요.' }); return;
    }
    setBusy(true, '이 기기에서 이어진 대화를 확인하고 있어요.');
    google.script.run
      .withSuccessHandler(function (result) {
        state.ready = true;
        state.studentCode = result.studentCode;
        state.joinCode = joinCode;
        state.sessionId = result.sessionId;
        state.closed = Boolean(result.isClosing);
        updateLearningStage(result);
        if (result.lesson) {
          state.bootstrapData.lesson = result.lesson;
          renderLesson(result.lesson, true);
        }
        elements.studentCodeLabel.textContent = '반-번호 · ' + result.studentCode;
        elements.exitSessionButton.hidden = false;
        elements.onboarding.hidden = true;
        elements.messages.textContent = '';
        (result.history || []).forEach(function (turn) {
          addMessage(turn.speaker === 'student' ? 'student' : 'bot', turn.text);
        });
        updateQuestionTypeBanner(result, result.history || []);
        renderClosingQuestionSummary();
        if (!(result.history || []).length) {
          addMessage('bot', state.bootstrapData.lesson.startQuestion || '지문을 읽고 궁금한 점을 물어보세요.');
        }
        try {
          sessionStorage.setItem(studentCodeStorageKey(state.bootstrapData.lesson), result.studentCode);
        } catch (error) {}
        // 닫힘 행이 먼저 저장되고 요약·평가 보정만 남았을 수 있으므로 pending 복구를 먼저 시도한다.
        const resumed = resumeStoredPendingRequest(result.history || []);
        if (state.closed && !resumed && !hasRequiredQuestions()) clearStoredStudentSession();
        setComposerEnabled(!state.closed && !resumed);
        if (!resumed) {
          setBusy(false, state.closed ? '이미 마친 대화입니다.' : '궁금한 점이나 생각을 이어 가 보세요.');
          if (!state.closed) elements.messageInput.focus();
        }
        updateRequiredAssessment(result);
      })
      .withFailureHandler(showError)
      .startLiteStudentSession(Object.assign({
        studentCode:code, joinCode:joinCode, deviceToken:state.deviceToken
      }, lessonIdentity()));
  }

  function sendTurn(action, message) {
    const recoveringClosedRequest = Boolean(
      state.closed && state.pendingRequest && state.pendingRequest.alreadyInHistory &&
      state.pendingRequest.action === action && state.pendingRequest.message === String(message || '').trim()
    );
    if (!state.ready || state.busy || (state.closed && !recoveringClosedRequest)) return;
    const retryingAssessmentStart = Boolean(state.pendingRequest && state.pendingRequest.action === 'start_assessment' &&
      state.pendingRequest.message === String(message || '').trim());
    if (action === 'start_assessment' && !retryingAssessmentStart && !canBeginAssessment()) return;
    const value = String(message || '').trim();
    if (!value || value.indexOf('___') >= 0) {
      setStatus(value ? '밑줄을 내 생각이나 궁금한 낱말로 바꿔 주세요.' : '생각이나 질문을 먼저 적어 주세요.');
      elements.messageInput.focus(); return;
    }
    const pending = state.pendingRequest;
    const reusingPendingRequest = Boolean(pending && pending.action === action && pending.message === value);
    const requestId = reusingPendingRequest
      ? pending.requestId
      : newRequestId();
    state.pendingRequest = reusingPendingRequest
      ? pending
      : {
          requestId:requestId, action:action, message:value, retryAttempts:0,
          alreadyInHistory:false, createdAt:Date.now()
        };
    saveStoredPendingRequest();
    if (!reusingPendingRequest) addMessage('student', value);
    elements.messageInput.value = '';
    setBusy(true, '지문과 수업 기준을 살펴보고 있어요.');
    setComposerEnabled(false);
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.retrySameRequest) {
          schedulePendingRetry(result.warning || '처리 결과를 확인하고 있어요. 잠시만 기다려 주세요.', 20);
          return;
        }
        const alreadyInHistory = Boolean(state.pendingRequest && state.pendingRequest.alreadyInHistory && result.duplicate);
        clearPendingRetry();
        state.pendingRequest = null;
        clearStoredPendingRequest();
        if (!alreadyInHistory) addMessage('bot', result.reply || '잠시 뒤 다시 이야기해 주세요.');
        state.sessionId = result.sessionId || state.sessionId;
        state.closed = Boolean(result.isClosing);
        updateLearningStage(result);
        updateQuestionTypeBanner(result);
        renderClosingQuestionSummary();
        if (state.closed && !hasRequiredQuestions()) clearStoredStudentSession();
        if (result.retryable && !elements.messageInput.value) elements.messageInput.value = value;
        setComposerEnabled(!state.closed);
        setBusy(false, state.closed
          ? '오늘 생각 나누기를 마쳤어요.'
          : result.warning || (result.retryable ? '잠시 뒤 같은 질문을 다시 보내 주세요.' : '계속 생각을 이어 가 보세요.'));
        if (!state.closed) elements.messageInput.focus();
        updateRequiredAssessment(result);
      })
      .withFailureHandler(function (error) {
        const message = error && error.message ? error.message : '연결을 다시 확인하고 있어요.';
        if (isPermanentTurnError(message)) stopPendingForRefresh(message);
        else schedulePendingRetry(message, 3);
      })
      .submitLiteTurn({
        requestId:requestId, studentCode:state.studentCode,
        joinCode:state.joinCode, deviceToken:state.deviceToken, message:value, action:action,
        lessonId:lessonIdentity().lessonId,
        lessonRevision:lessonIdentity().lessonRevision,
        sourceHash:lessonIdentity().sourceHash,
        previewAccessToken:state.previewAccessToken
      });
  }

  function schedulePendingRetry(message, maxAttempts) {
    if (!state.pendingRequest || (state.closed && !state.pendingRequest.alreadyInHistory)) return;
    window.clearTimeout(state.retryTimer);
    const attempts = Number(state.pendingRequest.retryAttempts || 0) + 1;
    state.pendingRequest.retryAttempts = attempts;
    saveStoredPendingRequest();
    if (attempts > Number(maxAttempts || 3)) {
      state.busy = false;
      elements.status.classList.remove('busy');
      setComposerEnabled(false);
      elements.retryTurnButton.dataset.action = 'retry';
      elements.retryTurnButton.textContent = '전송 결과 다시 확인';
      elements.retryTurnButton.hidden = false;
      setStatus((message || '전송 결과를 확인하지 못했어요.') + ' 버튼을 눌러 같은 전송 번호로 다시 확인할 수 있어요.');
      return;
    }
    // 같은 순간에 넘친 요청이 같은 박자로 다시 몰리지 않도록 짧은 무작위 간격을 둔다.
    const delay = Math.min(8000, 1200 + attempts * 900 + Math.floor(Math.random() * 1800));
    setComposerEnabled(false);
    setBusy(true, (message || '처리 결과를 확인하고 있어요.') + ' 자동으로 다시 확인합니다.');
    state.retryTimer = window.setTimeout(function () {
      if (!state.pendingRequest || (state.closed && !state.pendingRequest.alreadyInHistory)) return;
      const pending = state.pendingRequest;
      state.busy = false;
      sendTurn(pending.action, pending.message);
    }, delay);
  }

  function clearPendingRetry() {
    window.clearTimeout(state.retryTimer);
    state.retryTimer = null;
    if (elements.retryTurnButton) elements.retryTurnButton.hidden = true;
  }

  function retryPendingTurn() {
    if (elements.retryTurnButton.dataset.action === 'recover-bootstrap') {
      const pending = state.bootstrapRecoveryPending || readActivePendingRequest();
      if (pending) recoverPendingBeforeBootstrap(pending, 0);
      return;
    }
    if (elements.retryTurnButton.dataset.action === 'refresh') {
      window.location.reload();
      return;
    }
    if (!state.pendingRequest || (state.closed && !state.pendingRequest.alreadyInHistory)) return;
    elements.retryTurnButton.hidden = true;
    state.busy = false;
    sendTurn(state.pendingRequest.action, state.pendingRequest.message);
  }

  function isPermanentTurnError(message) {
    return /수업자료를 새로|수업 활동을 마쳤|전용 주소|이미 마친 대화|화면을 새로고침/.test(String(message || ''));
  }

  function stopPendingForRefresh(message) {
    clearPendingRetry();
    clearStoredPendingRequest();
    state.pendingRequest = null;
    state.busy = false;
    state.canStartAssessment = false;
    elements.status.classList.remove('busy');
    setComposerEnabled(false);
    elements.retryTurnButton.dataset.action = 'refresh';
    elements.retryTurnButton.textContent = '수업 새로고침';
    elements.retryTurnButton.hidden = false;
    setStatus(message + ' 수업을 새로고침해 주세요.');
  }

  function preparePrompt(template) {
    if (!state.ready || state.busy || state.closed || state.pendingRequest) return;
    state.pendingRequest = null;
    elements.messageInput.value = template;
    elements.messageInput.focus();
    const start = template.indexOf('___');
    if (start >= 0) elements.messageInput.setSelectionRange(start, start + 3);
  }

  function addMessage(role, text, botName) {
    const item = document.createElement('article');
    item.className = 'message ' + (role === 'student' ? 'student' : 'bot');
    const label = document.createElement('div'); label.className = 'message-label';
    const icon = document.createElement('span'); icon.className = 'message-label-icon';
    icon.textContent = role === 'student' ? '나' : 's';
    const name = document.createElement('span');
    name.textContent = role === 'student' ? '내 생각' : (botName || (state.bootstrapData && state.bootstrapData.lesson.appName) || 'simbot');
    label.appendChild(icon); label.appendChild(name);
    const body = document.createElement('div'); body.className = 'message-body'; body.textContent = text || '';
    item.appendChild(label); item.appendChild(body); elements.messages.appendChild(item);
    elements.messages.scrollTop = elements.messages.scrollHeight;
  }

  function adjustMaterialFont(delta) {
    state.materialFontStep = Math.max(0, Math.min(3, state.materialFontStep + delta));
    const sizes = ['.94rem','1.08rem','1.22rem','1.36rem'];
    document.documentElement.style.setProperty('--material-font-size', sizes[state.materialFontStep]);
  }

  function switchPanel(panel) {
    ['material','chat'].forEach(function (name) {
      document.getElementById(name + '-panel').classList.toggle('active', name === panel);
    });
    elements.mobileTabs.forEach(function (tab) {
      const active = tab.dataset.panel === panel;
      tab.classList.toggle('active', active); tab.setAttribute('aria-selected', active ? 'true' : 'false');
      tab.tabIndex = active ? 0 : -1;
    });
  }

  function handleTabKeydown(event) {
    const keys = ['ArrowLeft','ArrowRight','Home','End'];
    if (keys.indexOf(event.key) < 0) return;
    event.preventDefault();
    const current = elements.mobileTabs.indexOf(event.currentTarget);
    const target = event.key === 'Home' ? 0
      : event.key === 'End' ? elements.mobileTabs.length - 1
        : event.key === 'ArrowLeft' ? (current - 1 + elements.mobileTabs.length) % elements.mobileTabs.length
          : (current + 1) % elements.mobileTabs.length;
    const tab = elements.mobileTabs[target];
    switchPanel(tab.dataset.panel);
    tab.focus();
  }

  function setComposerEnabled(enabled) {
    state.composerEnabled = Boolean(enabled);
    [elements.messageInput,elements.definitionButton,elements.researchButton,
      elements.evidenceButton,elements.reviseButton,elements.whyButton,elements.contentButton,elements.closeButton]
      .forEach(function (control) { if (control) control.disabled = !enabled; });
    const send = elements.chatForm && elements.chatForm.querySelector('.send-button');
    if (send) send.disabled = !enabled;
    renderLearningStage();
  }

  function setBusy(busy, message) {
    state.busy = busy;
    elements.status.classList.toggle('busy', busy);
    if (elements.exitSessionButton) {
      elements.exitSessionButton.disabled = busy || Boolean(state.pendingRequest);
    }
    renderLearningStage();
    setStatus(message);
  }

  function setStatus(message) { elements.status.textContent = message || ''; }

  function showError(error) {
    state.busy = false; elements.status.classList.remove('busy');
    state.canStartAssessment = false;
    renderLearningStage();
    setStatus(error && error.message ? error.message : String(error));
    if (!state.bootstrapData) {
      elements.onboarding.hidden = false;
      elements.startButton.disabled = true;
      elements.retryBootstrapButton.hidden = false;
    }
  }

  function studentCodeStorageKey(lesson) {
    return 'lite-student-code:' + String(lesson.lessonId || lesson.materialTitle || 'lesson') + ':r' + String(lesson.lessonRevision || 1);
  }

  function pendingRequestStorageKey(identityOverride, studentCodeOverride, deviceTokenOverride) {
    const identity = identityOverride || lessonIdentity();
    return [
      'lite-pending-request', identity.lessonId, 'r' + identity.lessonRevision,
      studentCodeOverride || state.studentCode || 'unknown', deviceTokenOverride || state.deviceToken
    ].join(':');
  }

  function pendingPayload(pending) {
    return {
      requestId:String(pending.requestId || ''),
      studentCode:String(pending.studentCode || ''),
      joinCode:String(pending.joinCode || ''),
      deviceToken:String(pending.deviceToken || ''),
      message:String(pending.message || ''),
      action:String(pending.action || 'message'),
      lessonId:String(pending.lessonId || ''),
      lessonRevision:Number(pending.lessonRevision || 0),
      sourceHash:String(pending.sourceHash || ''),
      previewAccessToken:String(pending.previewAccessToken || '')
    };
  }

  function isValidStoredPending(pending) {
    const createdAt = Number(pending && pending.createdAt || 0);
    return Boolean(pending) && createdAt > 0 && createdAt <= Date.now() + 5 * 60 * 1000 &&
      Date.now() - createdAt <= ACTIVE_PENDING_MAX_AGE_MS &&
      /^[A-Za-z0-9_-]{12,100}$/.test(String(pending.requestId || '')) &&
      /^\d{1,2}\s*-\s*\d{1,3}$/.test(String(pending.studentCode || '')) &&
      /^[A-Za-z0-9_-]{16,100}$/.test(String(pending.deviceToken || '')) &&
      Boolean(String(pending.lessonId || '')) &&
      Number(pending.lessonRevision || 0) >= 1 &&
      /^[A-Za-z0-9_-]{24}$/.test(String(pending.sourceHash || '')) &&
      Boolean(pending.message) && Boolean(pending.action);
  }

  function readActivePendingRequest() {
    try {
      const value = JSON.parse(sessionStorage.getItem(ACTIVE_PENDING_STORAGE_KEY) || 'null');
      return isValidStoredPending(value) ? value : null;
    } catch (error) { return null; }
  }

  function saveStoredPendingRequest() {
    if (!state.pendingRequest || !state.studentCode) return;
    const identity = lessonIdentity();
    const stored = Object.assign({}, state.pendingRequest, identity, {
      studentCode:state.studentCode,
      joinCode:state.joinCode,
      deviceToken:state.deviceToken,
      previewAccessToken:state.previewAccessToken,
      createdAt:Number(state.pendingRequest.createdAt || Date.now())
    });
    try {
      sessionStorage.setItem(pendingRequestStorageKey(), JSON.stringify(state.pendingRequest));
      sessionStorage.setItem(ACTIVE_PENDING_STORAGE_KEY, JSON.stringify(stored));
    }
    catch (error) {}
  }

  function readStoredPendingRequest() {
    try {
      const value = JSON.parse(sessionStorage.getItem(pendingRequestStorageKey()) || 'null');
      if (!value || !/^[A-Za-z0-9_-]{12,100}$/.test(String(value.requestId || '')) ||
          !value.message || !value.action) return null;
      return value;
    } catch (error) { return null; }
  }

  function clearStoredPendingRequest(pendingOverride) {
    const pending = pendingOverride || readActivePendingRequest();
    try {
      if (state.studentCode && state.bootstrapData) sessionStorage.removeItem(pendingRequestStorageKey());
      if (pending) {
        sessionStorage.removeItem(pendingRequestStorageKey({
          lessonId:pending.lessonId, lessonRevision:pending.lessonRevision
        }, pending.studentCode, pending.deviceToken));
      }
      sessionStorage.removeItem(ACTIVE_PENDING_STORAGE_KEY);
    }
    catch (error) {}
  }

  function resumeStoredPendingRequest(history) {
    const pending = readStoredPendingRequest();
    if (!pending) return false;
    pending.alreadyInHistory = (history || []).some(function (row) {
      return String(row.requestId || '') === String(pending.requestId);
    });
    if (state.closed && !pending.alreadyInHistory) {
      clearStoredPendingRequest();
      state.pendingRequest = null;
      return false;
    }
    state.pendingRequest = pending;
    if (!pending.alreadyInHistory) addMessage('student', pending.message);
    schedulePendingRetry('전송 중이던 질문의 결과를 확인하고 있어요.', 20);
    return true;
  }

  function clearStoredStudentSession() {
    try {
      clearStoredPendingRequest();
      if (state.bootstrapData) sessionStorage.removeItem(studentCodeStorageKey(state.bootstrapData.lesson));
      sessionStorage.removeItem('lite-question-bot-device');
    } catch (error) {}
  }

  function leaveDeviceSession() {
    if (state.requiredSubmitting) {
      setStatus('답변의 저장 결과를 확인하고 있어요. 잠시 뒤 나갈 수 있어요.');
      return;
    }
    if (state.busy || state.pendingRequest) {
      setStatus('전송 중인 질문의 기록을 확인한 뒤 이 기기에서 나갈 수 있어요.');
      return;
    }
    if (!window.confirm('이 기기의 대화 연결을 끝낼까요? 다시 들어오면 새 대화로 시작됩니다.')) return;
    clearPendingRetry();
    state.pendingRequest = null;
    state.busy = false;
    clearStoredStudentSession();
    window.location.reload();
  }

  function hasRequiredQuestions() {
    const lesson = state.bootstrapData && state.bootstrapData.lesson || {};
    return lesson.activityMode === 'evaluation' && Array.isArray(lesson.requiredQuestions) && lesson.requiredQuestions.length === 2;
  }

  function updateLearningStage(result) {
    result = result || {};
    const lesson = state.bootstrapData && state.bootstrapData.lesson || {};
    if (lesson.activityMode !== 'evaluation') {
      state.learningStage = '';
      state.canStartAssessment = false;
      renderLearningStage();
      return;
    }
    if (['understanding','assessment','complete'].indexOf(result.learningStage) >= 0) {
      state.learningStage = result.learningStage;
      state.canStartAssessment = result.learningStage === 'understanding' && result.canStartAssessment === true &&
        result.ok !== false && !result.retryable && !result.retrySameRequest;
    } else if (state.learningStage) {
      // A partial error response cannot authorize a stage transition.
      state.canStartAssessment = false;
    }
    renderLearningStage();
  }

  function canBeginAssessment() {
    const lesson = state.bootstrapData && state.bootstrapData.lesson || {};
    return lesson.activityMode === 'evaluation' && state.ready && state.learningStage === 'understanding' && state.canStartAssessment &&
      state.composerEnabled && !state.busy && !state.closed && !state.pendingRequest && !state.bootstrapRecoveryPending;
  }

  function startAssessment() {
    if (!canBeginAssessment()) return;
    sendTurn('start_assessment', '글을 이해했어요. 평가를 시작할게요.');
  }

  function renderLearningStage() {
    const lesson = state.bootstrapData && state.bootstrapData.lesson || {};
    const understanding = lesson.activityMode === 'evaluation' && state.ready && !state.closed &&
      state.learningStage === 'understanding';
    const exploration = lesson.activityMode === 'exploration';
    if (elements.understandingNotice) elements.understandingNotice.hidden = !understanding;
    if (elements.understandingGuidance) elements.understandingGuidance.textContent = state.canStartAssessment
      ? '더 궁금한 점을 물어봐도 좋아요. 준비가 되면 평가를 시작하세요.'
      : '제목을 보고 내용을 짐작하고, 글에서 궁금한 점을 질문해 주세요.';
    if (elements.assessmentStartDock) elements.assessmentStartDock.hidden = !understanding;
    if (elements.startAssessmentButton) elements.startAssessmentButton.disabled = !canBeginAssessment();
    if (elements.quickActions) elements.quickActions.hidden = !exploration;
    [elements.researchButton,elements.evidenceButton,elements.reviseButton].forEach(function (button) {
      if (button) button.hidden = !exploration;
    });
    [elements.whyButton,elements.contentButton].forEach(function (button) {
      if (button) button.hidden = true;
    });
    if (elements.activityModeLabel && state.ready && state.learningStage) {
      elements.activityModeLabel.textContent = understanding ? '글 이해하기'
        : state.learningStage === 'complete' ? '평가 완료' : '평가 모드';
    }
    if (elements.startQuestion && state.ready && state.learningStage) {
      elements.startQuestion.textContent = understanding ? (lesson.startQuestion || '글을 읽고 궁금한 것을 질문해 주세요! 제목을 보고 어떤 내용인지 생각해 볼까요?')
        : lesson.requiredQuestions && lesson.requiredQuestions[0] ? lesson.requiredQuestions[0].question : lesson.startQuestion || '';
    }
  }

  function updateRequiredAssessment(result) {
    result = result || {};
    updateLearningStage(result);
    const understanding = state.learningStage === 'understanding';
    elements.requiredAssessmentNotice.hidden = !hasRequiredQuestions() || understanding;
    if (!hasRequiredQuestions() || understanding) {
      state.requiredAssessmentReady = false;
      elements.retryRequiredAssessment.hidden = true;
      return;
    }
    state.requiredAssessmentReady = Boolean(result.requiredAssessmentReady);
    if (result.requiredSubmission) state.requiredSubmission = result.requiredSubmission;
    const submission = state.requiredSubmission;
    const finished = submission && submission.submitted && submission.analysisStatus !== 'ready';
    const progress = result.requiredAssessmentProgress;
    const count = progress ? Math.max(0, Math.min(2, Number(progress.completed) || 0)) : 0;
    elements.requiredAssessmentStatus.textContent = finished
      ? '두 문항의 답변을 기록했어요. 선생님이 확인합니다.'
      : state.requiredAssessmentReady ? '두 문항의 답변을 기록하고 있어요.'
        : '필수 평가 ' + count + '/2 · 대화하며 내 생각과 근거를 말해 주세요.';
    if (state.requiredAssessmentReady && !finished) finalizeRequiredAssessment();
  }

  function finalizeRequiredAssessment() {
    if (!state.ready || state.learningStage === 'understanding' || !hasRequiredQuestions() || !state.requiredAssessmentReady || state.requiredSubmitting) return;
    if (state.requiredSubmission && state.requiredSubmission.submitted && state.requiredSubmission.analysisStatus !== 'ready') return;
    state.requiredSubmitting = true;
    elements.retryRequiredAssessment.hidden = true;
    elements.requiredAssessmentStatus.textContent = '두 문항의 답변을 확인하고 있어요. 잠시 기다려 주세요.';
    google.script.run.withSuccessHandler(function (result) {
      state.requiredSubmitting = false;
      if (result && result.submitted) {
        state.requiredSubmission = result;
        elements.requiredAssessmentStatus.textContent = '두 문항의 답변을 기록했어요. 선생님이 확인합니다.';
      } else {
        elements.requiredAssessmentStatus.textContent = '필수 두 문항에 대한 대화를 이어 가 주세요.';
      }
    }).withFailureHandler(function (error) {
      state.requiredSubmitting = false;
      const message = error && error.message || '';
      const refresh = isPermanentTurnError(message) || /수업.*종료|수업 참여코드|입장이 제한/.test(message);
      elements.requiredAssessmentStatus.textContent = refresh
        ? message + ' 수업을 새로고침해 주세요.'
        : '대화는 저장되어 있어요. 버튼을 눌러 답변 기록을 다시 확인해 주세요.';
      elements.retryRequiredAssessment.hidden = refresh;
    }).finalizeLiteRequiredAssessment(Object.assign({
      studentCode:state.studentCode, joinCode:state.joinCode, deviceToken:state.deviceToken
    }, lessonIdentity()));
  }

  function lessonIdentity() {
    const lesson = state.bootstrapData && state.bootstrapData.lesson || {};
    return {
      lessonId:String(lesson.lessonId || ''),
      lessonRevision:Number(lesson.lessonRevision || 1),
      sourceHash:String(lesson.sourceHash || ''),
      previewAccessToken:state.previewAccessToken
    };
  }

  function getOrCreateDeviceToken() {
    const key = 'lite-question-bot-device';
    let token = '';
    try { token = sessionStorage.getItem(key) || ''; } catch (error) {}
    if (!/^[A-Za-z0-9_-]{16,100}$/.test(token)) {
      token = typeof crypto !== 'undefined' && crypto.randomUUID
        ? crypto.randomUUID().replace(/-/g, '')
        : 'device_' + Date.now().toString(36) + Math.random().toString(36).slice(2,18);
      try { sessionStorage.setItem(key, token); } catch (error) {}
    }
    return token;
  }

  function newRequestId() {
    return typeof crypto !== 'undefined' && crypto.randomUUID
      ? 'req_' + crypto.randomUUID().replace(/-/g, '')
      : 'req_' + Date.now().toString(36) + Math.random().toString(36).slice(2,18);
  }
</script>
